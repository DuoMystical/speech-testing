<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Speech-to-Text</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Real-time STT</h1>
            <div id="connection-status" class="status disconnected">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </header>

        <main>
            <!-- Microphone Control Section -->
            <section class="mic-section">
                <div class="mic-container">
                    <button id="mic-btn" class="mic-btn" disabled>
                        <svg id="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <div id="mic-status" class="mic-status">Click to start</div>
                </div>

                <div class="vad-indicator">
                    <div id="vad-status" class="vad-status">
                        <span class="vad-dot"></span>
                        <span class="vad-text">Waiting...</span>
                    </div>
                </div>

                <div class="audio-visualizer">
                    <canvas id="visualizer" width="800" height="80"></canvas>
                </div>
            </section>

            <!-- Transcript Section -->
            <section class="transcript-section">
                <div class="transcript-header">
                    <h2>Transcript</h2>
                    <div class="transcript-actions">
                        <button id="copy-btn" class="action-btn" title="Copy transcript">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                            </svg>
                        </button>
                        <button id="clear-btn" class="action-btn" title="Clear transcript">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="transcript-container" class="transcript-container">
                    <div id="transcript" class="transcript">
                        <span class="placeholder">Your transcription will appear here...</span>
                    </div>
                    <div id="partial-transcript" class="partial-transcript"></div>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">Session Duration</span>
                    <span id="session-duration" class="stat-value">0:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Audio Processed</span>
                    <span id="audio-processed" class="stat-value">0.0s</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Latency</span>
                    <span id="latency" class="stat-value">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Words</span>
                    <span id="word-count" class="stat-value">0</span>
                </div>
            </section>

            <!-- Advanced Settings -->
            <section class="advanced-section">
                <details>
                    <summary>Advanced Settings</summary>
                    <div class="settings-grid">
                        <div class="setting">
                            <label for="vad-threshold">VAD Threshold</label>
                            <input type="range" id="vad-threshold" min="0.1" max="0.9" step="0.1" value="0.5">
                            <span id="vad-threshold-value">0.5</span>
                        </div>
                        <div class="setting">
                            <label for="silence-timeout">Silence Timeout (ms)</label>
                            <input type="number" id="silence-timeout" min="100" max="2000" step="100" value="300">
                        </div>
                    </div>
                </details>
            </section>
        </main>

        <footer>
            <p>Powered by <a href="https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3" target="_blank">Parakeet-TDT</a> & <a href="https://github.com/TEN-framework/ten-vad" target="_blank">TEN VAD</a></p>
        </footer>
    </div>

    <script src="js/audio-processor.js"></script>
    <script src="js/websocket-client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
