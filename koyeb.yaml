# Koyeb deployment configuration
# Deploy with: koyeb app create stt-server --docker ghcr.io/YOUR_USER/stt-server:latest --instance-type gpu-nvidia-a100

name: stt-server

service:
  name: stt-server
  type: web

  # Use GPU instance (A100)
  instance_type: gpu-nvidia-a100

  # Docker configuration - startup.sh handles model download
  docker:
    image: ghcr.io/YOUR_USER/stt-server:latest
    command: ["/app/scripts/startup.sh"]

  # Environment variables
  env:
    - key: MODELS_DIR
      value: /app/models
    - key: SCRIPTS_DIR
      value: /app/scripts
    - key: FRONTEND_PATH
      value: /app/frontend
    - key: PORT
      value: "8080"
    - key: RUST_LOG
      value: info
    - key: ORT_TENSORRT_ENGINE_CACHE_ENABLE
      value: "1"
    - key: ORT_TENSORRT_CACHE_PATH
      value: /app/tensorrt-cache
    - key: ORT_TENSORRT_FP16_ENABLE
      value: "1"

  # Port configuration
  ports:
    - port: 8080
      protocol: http

  # Health check - long start period for model download/export
  health_checks:
    - path: /health
      port: 8080
      protocol: http
      interval_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 1
      unhealthy_threshold: 3
      grace_period_seconds: 600  # 10 min for model setup

  # Scaling - start with 1 for cost
  scaling:
    min: 1
    max: 1

  # Persistent storage for models (prevents re-download on restart)
  volumes:
    - name: models
      path: /app/models
      size: 10Gi
    - name: tensorrt-cache
      path: /app/tensorrt-cache
      size: 5Gi
