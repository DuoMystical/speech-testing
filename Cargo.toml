[package]
name = "stt-server"
version = "0.1.0"
edition = "2021"
description = "Real-time Speech-to-Text server with VAD using Parakeet-TDT and TEN VAD"

[dependencies]
# Web server
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ONNX Runtime with CUDA/TensorRT support
ort = { version = "2.0.0-rc.11", features = ["cuda", "tensorrt"] }

# Audio processing
rubato = "0.15"           # Resampling
hound = "3.5"             # WAV reading (for testing)

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Utilities
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.14"         # Safe transmutes for audio buffers
ringbuf = "0.4"           # Lock-free ring buffer for audio

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
